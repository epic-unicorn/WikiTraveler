# Single-node deployment
# Usage: docker compose -f docker/docker-compose.yml up

name: wikitraveler

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikitraveler
      POSTGRES_PASSWORD: wikitraveler
      POSTGRES_DB: wikitraveler
    # Expose on localhost only so host tools (pnpm db:setup, Prisma Studio) can connect.
    # Inside the compose network the node still uses host "postgres".
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikitraveler"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      # Override host .env — inside the compose network the DB host is "postgres"
      DATABASE_URL: postgresql://wikitraveler:wikitraveler@postgres:5432/wikitraveler
      NODE_ENV: production

  # Optional — enable with: docker compose --profile access up
  access:
    profiles: ["access"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.access
      args:
        NEXT_PUBLIC_NODE_API_URL: ${NEXT_PUBLIC_NODE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - node
    ports:
      - "${ACCESS_PORT:-3001}:3001"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"

volumes:
  postgres_data:

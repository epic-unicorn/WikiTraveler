# Development mode — hot-reloading, no production build required
# Usage: docker compose -f docker/docker-compose.dev.yml up
# Or: right-click this file in the VS Code Docker extension → "Compose Up"

name: wikitraveler

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wikitraveler
      POSTGRES_PASSWORD: wikitraveler
      POSTGRES_DB: wikitraveler
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikitraveler"]
      interval: 5s
      timeout: 5s
      retries: 10

  node:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount the whole monorepo for hot reloading
      - ..:/app
      # Isolated .next so the container's dev build never reads/writes the
      # host's (possibly stale, production) .next — that mismatch corrupts
      # webpack chunks and crashes route loading.
      - next:/app/apps/node/.next
      # Named volumes keep the container's node_modules intact so the
      # Windows host node_modules (or absence thereof) doesn't interfere.
      - node_modules:/app/node_modules
      - node_modules_core:/app/packages/core/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - node_modules_i18n:/app/packages/i18n/node_modules
      - node_modules_ai_agent:/app/packages/ai-agent/node_modules
      - node_modules_sdk:/app/packages/sdk/node_modules
      - node_modules_node_app:/app/apps/node/node_modules
      - node_modules_access:/app/apps/access/node_modules
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://wikitraveler:wikitraveler@postgres:5432/wikitraveler
      NODE_ENV: development

  # Optional — enable with: docker compose --profile access up
  access:
    profiles: ["access"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      node:
        condition: service_started
    ports:
      - "${ACCESS_PORT:-3001}:3001"
    volumes:
      - ..:/app
      - next_access:/app/apps/access/.next
      - node_modules:/app/node_modules
      - node_modules_core:/app/packages/core/node_modules
      - node_modules_ui:/app/packages/ui/node_modules
      - node_modules_i18n:/app/packages/i18n/node_modules
      - node_modules_ai_agent:/app/packages/ai-agent/node_modules
      - node_modules_sdk:/app/packages/sdk/node_modules
      - node_modules_node_app:/app/apps/node/node_modules
      - node_modules_access:/app/apps/access/node_modules
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_NODE_API_URL: ${NEXT_PUBLIC_NODE_API_URL:-http://localhost:3000}
    entrypoint: ["/entrypoint.access.dev.sh"]

volumes:
  postgres_data:
  next:
  next_access:
  node_modules:
  node_modules_core:
  node_modules_ui:
  node_modules_i18n:
  node_modules_ai_agent:
  node_modules_sdk:
  node_modules_node_app:
  node_modules_access:

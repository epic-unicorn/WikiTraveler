name: Accessibility tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:a11y

  lighthouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wikitraveler
          POSTGRES_PASSWORD: wikitraveler
          POSTGRES_DB: wikitraveler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wikitraveler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wikitraveler:wikitraveler@localhost:5432/wikitraveler
      JWT_SECRET: ci-lighthouse-secret
      NODE_URL: http://localhost:3000
      NODE_ID: ci-lighthouse
      NEXT_PUBLIC_NODE_API_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm exec tsx scripts/ci-bootstrap-region.ts

      - run: pnpm db:seed

      - run: pnpm build

      - name: Start node
        run: pnpm --filter @wikitraveler/node start &

      - name: Start access
        run: pnpm --filter @wikitraveler/access start &

      - name: Wait for servers
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health >/dev/null && curl -sf http://localhost:3001/login >/dev/null; then
              echo "Servers ready"
              exit 0
            fi
            sleep 2
          done
          echo "Servers did not become ready in time"
          exit 1

      - run: pnpm lighthouse:prepare

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          install-dependencies: true

      - name: Set CHROME_PATH
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - run: pnpm lighthouse:ci

      # upload-artifact@v4 skips paths listed in .gitignore — .lighthouseci is ignored
      - name: Stage Lighthouse reports for upload
        if: always()
        run: |
          if [ -d .lighthouseci ] && [ -n "$(ls -A .lighthouseci 2>/dev/null)" ]; then
            mkdir -p lighthouse-ci-artifacts
            cp -a .lighthouseci/. lighthouse-ci-artifacts/
            echo "Staged $(find lighthouse-ci-artifacts -type f | wc -l) report file(s)"
          else
            echo "No .lighthouseci reports to stage"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-ci-artifacts/
          if-no-files-found: warn

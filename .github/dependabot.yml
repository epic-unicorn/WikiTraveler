version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 90
    groups:
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Review major upgrades manually (Next 16, ESLint 10, TypeScript 7, etc.)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
